<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>our memory island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
  .snd-btn{
    position:absolute; top:10px; right:10px; z-index:25;
    background:rgba(255,255,255,.85); border:none; border-radius:14px; padding:4px 10px;
    font-size:.8rem; cursor:pointer; opacity:0; transition:opacity .6s ease .6s;
  }

  .stage.loaded .snd-btn{ opacity:1; }
  :root{
    --sky-top:#aecbe8; --sky-bottom:#f6dfe6;
    --ink:#4a3826; --ink-dim:#8c7a5e;
    --panel:#faf3e3; --panel-line:#d9c9a3;
    --accent:#e6bd6e;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    background:#1b1f2e; font-family:'Nunito',sans-serif; overflow:hidden;
  }
  .stage{
    width:100vw; height:100vh; position:relative;
    border-radius:0; overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    box-shadow:none;
  }
  @media (max-width:560px){
    .stage{ aspect-ratio:4/5; }
    .label .tag{ font-size:.85rem; padding:2px 8px; }
    .label .sub{ font-size:.52rem; padding:1px 6px; }
    .label .pres{ font-size:.5rem; padding:1px 6px; }
  }
  canvas{ position:absolute; inset:0; display:block; cursor:grab; touch-action:none; }
  canvas.grabbing{ cursor:grabbing; }

  .title-bar{
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:20;
    text-align:center; pointer-events:none;
    opacity:0; transition:opacity .8s ease .3s;
  }
  .stage.loaded .title-bar{ opacity:1; }
  .title-bar h1{ font-family:'Caveat',cursive; font-size:1.7rem; color:#3b2f22; margin:0; text-shadow:0 1px 4px rgba(255,255,255,0.5); }
  .title-bar p{ font-size:0.7rem; color:#5a4a37; margin:2px 0 0; }

  .label{
    position:absolute; z-index:15; transform:translate(-50%,-100%);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    cursor:pointer; pointer-events:auto;
    opacity:0; transition:opacity .5s ease, transform .2s ease;
  }
  .stage.loaded .label{ opacity:1; }
  .label:hover{ transform:translate(-50%,-105%) scale(1.06); }
  .label .tag{
    font-family:'Caveat',cursive; font-weight:700; font-size:1rem;
    background:#fffaf0; color:var(--ink); padding:3px 10px; border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.25); white-space:nowrap;
  }
  .label .sub{
    font-size:0.6rem; color:#fffaf0; background:rgba(74,56,38,0.75);
    padding:1px 8px; border-radius:8px; white-space:nowrap;
  }
  .label .pres{
    display:none; font-size:.6rem; background:rgba(255,255,255,.92); color:var(--ink);
    padding:1px 8px; border-radius:8px; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .label .pres.show{ display:block; }

  .hint{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:20;
    font-size:0.68rem; color:#5a4a37; background:rgba(255,255,255,0.7);
    padding:5px 12px; border-radius:20px; opacity:0; transition:opacity .6s ease .6s; pointer-events:none;
    white-space:nowrap;
  }
  .stage.loaded .hint{ opacity:1; }

  .me-pill{
    position:absolute; top:10px; left:10px; z-index:25;
    background:rgba(255,255,255,.85); border:none; border-radius:14px; padding:4px 11px;
    font-family:'Nunito',sans-serif; font-size:.68rem; font-weight:700; color:var(--ink); cursor:pointer;
    opacity:0; transition:opacity .6s ease .6s;
  }
  .stage.loaded .me-pill{ opacity:1; }

  .zoom-controls{
    position:absolute; bottom:10px; right:10px; z-index:20;
    display:flex; flex-direction:column; gap:6px;
    opacity:0; transition:opacity .6s ease .6s;
  }
  .stage.loaded .zoom-controls{ opacity:1; }
  .zoom-controls button{
    width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,0.85);
    color:var(--ink); font-size:0.95rem; font-weight:700; cursor:pointer;
  }

  /* who's visiting? */
  .who-overlay{
    position:fixed; inset:0; z-index:250; background:rgba(20,14,10,.55);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .who-overlay.show{ display:flex; }
  .who-card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:12px;
    padding:22px 28px; text-align:center; color:var(--ink);
  }
  .who-card h3{ font-family:'Caveat',cursive; font-size:1.8rem; margin:0 0 12px; }
  .who-card button{ margin:0 6px; }

  /* ---- modal (same size for every island; content scrolls inside) ---- */
  .modal-back{
    position:fixed; inset:0; background:rgba(20,14,10,0.6); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-back.show{ display:flex; }
  .modal{
    width:100%; max-width:780px; height:min(600px, 88vh); overflow-y:auto;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:22px 24px; position:relative; color:var(--ink);
  }
  .modal h2{ font-family:'Caveat',cursive; font-size:1.9rem; margin:0 0 2px; }
  .modal .sub{ font-size:0.78rem; color:var(--ink-dim); margin:0 0 14px; }
  .modal .close{
    position:absolute; top:12px; right:14px; background:none; border:none;
    font-size:1.1rem; color:var(--ink-dim); cursor:pointer;
  }
  .m-btn{
    background:var(--accent); color:#3a2c14; border:none; border-radius:16px;
    padding:7px 16px; font-size:0.82rem; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif;
  }
  .saved-note{ font-size:0.72rem; color:var(--ink-dim); margin-left:8px; }

  .m-tabs{ display:flex; gap:10px; margin-bottom:16px; border-bottom:1px solid var(--panel-line); }
  .m-tab{
    font-family:'Caveat',cursive; font-weight:600; font-size:1.25rem; background:none; border:none;
    color:var(--ink-dim); padding:6px 6px 8px; cursor:pointer; border-bottom:2px solid transparent;
  }
  .m-tab.active{ color:var(--ink); border-color:var(--accent); }
  .m-panel{ display:none; }
  .m-panel.active{ display:block; }

  .p-form label{ display:block; font-size:0.7rem; color:var(--ink-dim); margin:8px 0 3px; }
  .p-form input, .p-form textarea{
    width:100%; padding:7px 8px; border:1px solid var(--panel-line); border-radius:6px;
    font-size:0.85rem; font-family:'Nunito',sans-serif; background:#fffdf8; color:var(--ink);
  }
  .p-form textarea{ min-height:110px; font-family:'Caveat',cursive; font-size:1.15rem; resize:vertical; }

  .who{ display:flex; gap:6px; align-items:center; margin-bottom:6px; font-size:.72rem; color:var(--ink-dim); }
  .who button{
    border:1px solid var(--panel-line); background:#fffdf8; border-radius:14px; padding:3px 12px;
    font-family:'Nunito',sans-serif; font-size:.78rem; cursor:pointer; color:var(--ink);
  }
  .who button.on{ background:var(--accent); border-color:var(--accent); font-weight:700; }

  .empty-mini{ grid-column:1/-1; text-align:center; font-family:'Caveat',cursive; font-size:1.15rem; color:var(--ink-dim); padding:22px; border:2px dashed var(--panel-line); border-radius:8px; }
  .empty-mini button{ display:block; margin:10px auto 0; }

  /* photos */
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; }
  .polaroid{
    background:#fffdf8; padding:7px 7px 9px; box-shadow:0 2px 8px rgba(0,0,0,0.18);
    position:relative; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;
  }
  .polaroid:nth-child(odd){ transform:rotate(-1.2deg); }
  .polaroid:nth-child(even){ transform:rotate(1deg); }
  .polaroid:hover{ transform:translateY(-4px) scale(1.03); box-shadow:0 8px 18px rgba(0,0,0,0.22); }
  .polaroid img{ width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--panel-line); display:block; }
  .polaroid .cap{ font-family:'Caveat',cursive; font-size:1.05rem; text-align:center; margin-top:5px; min-height:1.2em; }
  .polaroid .by{ font-size:.6rem; color:var(--ink-dim); text-align:center; }
  .polaroid .rm{
    position:absolute; top:10px; right:10px; background:rgba(255,255,255,.85); border:none; border-radius:10px;
    color:var(--ink-dim); font-size:.65rem; cursor:pointer; padding:1px 6px;
  }

  /* full-size photo viewer */
  .viewer{
    position:fixed; inset:0; background:rgba(20,14,10,.88); z-index:300;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .viewer figure{ margin:0; max-width:92vw; text-align:center; color:#fffaf0; }
  .viewer img{
    max-width:92vw; max-height:76vh; border:8px solid #fffdf8; border-radius:2px;
    box-shadow:0 10px 40px rgba(0,0,0,.5); background:#fffdf8;
  }
  .viewer figcaption{ font-family:'Caveat',cursive; font-size:1.5rem; margin-top:10px; }
  .viewer figcaption small{ display:block; font-family:'Nunito',sans-serif; font-size:.7rem; opacity:.7; }
  .viewer .vx{ position:absolute; top:14px; right:18px; background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; }
  .viewer .vnav{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); border:none;
    color:#fff; font-size:2rem; width:44px; height:44px; border-radius:50%; cursor:pointer; line-height:1;
  }
  .viewer .vprev{ left:14px; } .viewer .vnext{ right:14px; }

  /* bucket */
  .progress{ font-family:'Caveat',cursive; font-size:1.2rem; color:var(--ink-dim); margin-bottom:6px; }
  .bucket-item{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--panel-line); }
  .bucket-item .t{ flex:1; font-family:'Caveat',cursive; font-size:1.15rem; }
  .bucket-item .t small{ font-family:'Nunito',sans-serif; font-size:.6rem; color:var(--ink-dim); margin-left:6px; }
  .bucket-item.done .t{ text-decoration:line-through; color:var(--ink-dim); }
  .bucket-item .rm{ background:none; border:none; color:var(--ink-dim); font-size:.7rem; cursor:pointer; }
  .checkbox{ width:18px; height:18px; border:2px solid var(--ink-dim); border-radius:4px; cursor:pointer; flex:none; }
  .checkbox.checked{ background:var(--accent); border-color:var(--accent); }
  .add-row{ display:flex; gap:6px; margin-top:6px; }
  .add-row input{ flex:1; }

  /* letters */
  .letter{ background:#fffdf8; border:1px solid var(--panel-line); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .letter .meta{ font-size:.68rem; color:var(--ink-dim); margin-bottom:4px; }
  .letter .body{ font-family:'Caveat',cursive; font-size:1.2rem; line-height:1.4; white-space:pre-wrap; }
  .letter.sealed .body{ color:var(--ink-dim); font-style:italic; }

  /* countdown */
  .big{ text-align:center; margin:4px 0 16px; }
  .big .num{ font-family:'Caveat',cursive; font-size:3.4rem; font-weight:700; line-height:1; }
  .big .lbl{ font-size:.8rem; color:var(--ink-dim); margin-top:2px; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="title-bar">
    <h1>our memory island</h1>
    <p>tap an island — the train takes you there</p>
  </div>
  <div id="labelLayer"></div>
  <button class="me-pill" id="mePill">you: Jian ⇄</button>
  <button class="snd-btn" id="sndBtn">🔊</button>
  <div class="hint">drag to spin · hover or tap an island to call the train</div>
  <div class="zoom-controls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
  </div>
</div>

<div class="who-overlay" id="whoOverlay">
  <div class="who-card">
    <h3>who's visiting?</h3>
    <button class="m-btn" data-n="Jian">Jian</button>
    <button class="m-btn" data-n="Tepan">Tepan</button>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modal"></div>
</div>



<script>
(function(){
  const stageEl = document.getElementById('stage');
  const labelLayer = document.getElementById('labelLayer');
  const modalBack = document.getElementById('modalBack');
  const modal = document.getElementById('modal');
  const mePill = document.getElementById('mePill');
  const whoOverlay = document.getElementById('whoOverlay');

  const NAMES = ['Jian','Tepan'];
  // ================= SOUND =================
  const Sound = (function(){
    let ctx=null, master, musicLevel, sfxLevel, verb, pluckBus, noiseBuf;
    let unlocked=false, muted=false, lastWhistle=-99, chugT=0, wasMoving=false;
    try{ muted = localStorage.getItem('oi-muted') === '1'; }catch(e){}
    const btn = document.getElementById('sndBtn');
    const paint = () => { btn.textContent = muted ? '🔇' : '🔊'; };
    paint();
    const mtof = m => 440 * Math.pow(2, (m-69)/12);
    const CHORD = 5.6;
    const CHORDS = [ {r:48,n:[60,64,67,71]}, {r:45,n:[57,60,64,67]}, {r:50,n:[57,60,62,65]}, {r:43,n:[55,59,62,65]} ];
    const PENTA = [72,74,76,79,81,84];

    function init(){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(comp);
      // reverb from generated noise
      const len = ctx.sampleRate*3, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
      verb = ctx.createConvolver(); verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.7; verb.connect(wet); wet.connect(master);
      musicLevel = ctx.createGain(); musicLevel.gain.value = 0.0001; musicLevel.connect(master);
      const ms = ctx.createGain(); ms.gain.value = 0.5; musicLevel.connect(ms); ms.connect(verb);
      sfxLevel = ctx.createGain(); sfxLevel.gain.value = 0.9; sfxLevel.connect(master);
      const ss = ctx.createGain(); ss.gain.value = 0.3; sfxLevel.connect(ss); ss.connect(verb);
      // dreamy echo for the plucks
      pluckBus = ctx.createGain(); pluckBus.connect(musicLevel);
      const dl = ctx.createDelay(1.5); dl.delayTime.value = 0.525;
      const fb = ctx.createGain(); fb.gain.value = 0.4;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
      pluckBus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(musicLevel);
      // noise buffer (wind + train)
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
      return true;
    }

    // rel > 0 → hold the level then fade out over the last `rel` seconds (pads); otherwise plain decay
    function tone(o){
      const t = o.t, dest = o.dest || sfxLevel;
      const osc = ctx.createOscillator(); osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f, t);
      if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
      if(o.detune) osc.detune.value = o.detune;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(o.vol, t + (o.attack || 0.01));
      if(o.rel){ g.gain.setValueAtTime(o.vol, t + o.dur - o.rel); g.gain.linearRampToValueAtTime(0.0001, t + o.dur); }
      else g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      if(o.lp){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = o.lp; osc.connect(f); f.connect(g); }
      else osc.connect(g);
      g.connect(dest);
      osc.start(t); osc.stop(t + o.dur + 0.05);
    }

    // ---- music ----
    let nextChord=0, nextNote=0, chordIdx=0;
    function playChord(ch, t){
      ch.n.forEach((m,i) => {
        tone({ f:mtof(m), t, dur:CHORD+1.4, type:'triangle', vol:0.026, attack:1.4, rel:2.0, dest:musicLevel, lp:900, detune: i%2 ? 7 : -7 });
      });
      tone({ f:mtof(ch.r), t, dur:3.2, type:'sine', vol:0.14, attack:0.05, dest:musicLevel });
      tone({ f:mtof(ch.r), t:t+CHORD/2, dur:2.6, type:'sine', vol:0.1, attack:0.05, dest:musicLevel });
    }
    function pluck(m, t){
      tone({ f:mtof(m), t, dur:1.6, type:'triangle', vol:0.07, attack:0.008, dest:pluckBus, lp:2400 });
      tone({ f:mtof(m)*2, t, dur:0.5, type:'sine', vol:0.015, attack:0.005, dest:pluckBus });
    }
    function schedule(){
      const now = ctx.currentTime;
      if(nextChord < now) nextChord = now;
      if(nextNote < now) nextNote = now;
      while(nextChord < now + 2){ playChord(CHORDS[chordIdx % CHORDS.length], nextChord); chordIdx++; nextChord += CHORD; }
      while(nextNote < now + 2){
        if(Math.random() < 0.5) pluck(PENTA[Math.floor(Math.random()*PENTA.length)], nextNote);
        nextNote += 0.7;
      }
    }
    function startMusic(){
      musicLevel.gain.setTargetAtTime(0.6, ctx.currentTime, 1.8);
      nextChord = nextNote = ctx.currentTime + 0.3;
      schedule(); setInterval(schedule, 400);
      // soft wind
      const ns = ctx.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 500; bp.Q.value = 0.6;
      const ng = ctx.createGain(); ng.gain.value = 0.018;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
      const lg = ctx.createGain(); lg.gain.value = 0.012; lfo.connect(lg); lg.connect(ng.gain);
      ns.connect(bp); bp.connect(ng); ng.connect(musicLevel); ns.start(); lfo.start();
    }

    // ---- train ----
    function chug(t, v){
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 700; bp.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.06 + v*0.12, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      src.connect(bp); bp.connect(g); g.connect(sfxLevel);
      src.start(t, Math.random()*0.5); src.stop(t + 0.15);
      tone({ f:95, t, dur:0.09, type:'sine', vol:0.05, attack:0.005 });
    }
    function toot(t, len){
      [622, 784].forEach(f => tone({ f, t, dur:len, type:'triangle', vol:0.04, attack:0.04, rel:0.12, lp:1600 }));
    }
    function train(v){
      if(!ctx || ctx.state !== 'running' || muted){ wasMoving = false; return; }
      const now = ctx.currentTime;
      if(v > 0.02){
        wasMoving = true;
        if(now >= chugT){ chug(now, v); chugT = now + 0.55 - Math.min(1, v/0.26)*0.33; }
      } else if(v < 0.001 && wasMoving){
        wasMoving = false; sfx('bell');
      }
    }

    // ---- one-shot effects ----
    function sfx(name){
      if(!ctx || ctx.state !== 'running' || muted) return;
      const t = ctx.currentTime;
      switch(name){
        case 'tap':   tone({ f:700, f2:420, t, dur:0.09, vol:0.12, attack:0.003 }); break;
        case 'chime': [784,988,1319].forEach((f,i) => tone({ f, t:t+i*0.07, dur:0.55, type:'triangle', vol:0.08, attack:0.005 })); break;
        case 'check': [1319,1976].forEach((f,i) => tone({ f, t:t+i*0.05, dur:0.7, vol:0.08 - i*0.03, attack:0.005 })); break;
        case 'open':  tone({ f:523, t, dur:0.4, type:'triangle', vol:0.07 }); tone({ f:784, t:t+0.08, dur:0.4, type:'triangle', vol:0.07 }); break;
        case 'close': tone({ f:659, f2:440, t, dur:0.25, type:'triangle', vol:0.06 }); break;
        case 'bell':  tone({ f:784, t, dur:1.1, vol:0.08 }); tone({ f:587, t:t+0.4, dur:1.3, vol:0.08 }); break;
        case 'whistle':
          if(t - lastWhistle < 5) return;
          lastWhistle = t; toot(t, 0.22); toot(t+0.3, 0.4); break;
      }
    }

    // ---- start on first gesture (browsers block sound before that) ----
    const EVTS = ['pointerdown','pointerup','mousedown','touchend','click','keydown'];
    function unlock(){
      if(unlocked) return;
      if(!ctx && !init()) return;
      ctx.resume().then(() => {
        if(ctx.state === 'running' && !unlocked){
          unlocked = true;
          EVTS.forEach(ev => window.removeEventListener(ev, unlock, true));
          startMusic();
        }
      }).catch(()=>{});
    }
    EVTS.forEach(ev => window.addEventListener(ev, unlock, true));

    btn.addEventListener('click', () => {
      muted = !muted;
      try{ localStorage.setItem('oi-muted', muted ? '1' : '0'); }catch(e){}
      paint();

  })();

  // ================= STORAGE =================
  // Hosting outside Claude? Paste a Firebase Realtime Database URL here so you both share data
  // across devices, e.g. 'https://your-project-default-rtdb.firebaseio.com' (no trailing slash).
  // Empty = uses Claude's shared storage if available, otherwise this-device-only localStorage.
  const FIREBASE_URL = '';

  async function loadShared(key, fallback){
    try{
      if(FIREBASE_URL){
        const r = await fetch(`${FIREBASE_URL}/${key}.json`);
        const v = await r.json();
        return v === null ? fallback : v;
      }
      if(window.storage){
        const r = await window.storage.get(key, true);
        return r ? JSON.parse(r.value) : fallback;
      }
      const raw = localStorage.getItem('oi-' + key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  async function saveShared(key, value){
    try{
      if(FIREBASE_URL){
        const r = await fetch(`${FIREBASE_URL}/${key}.json`, { method:'PUT', body: JSON.stringify(value) });
        return r.ok;
      }
      if(window.storage){ await window.storage.set(key, JSON.stringify(value), true); return true; }
      localStorage.setItem('oi-' + key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }

  // ================= STATIONS =================
  // each station = its own floating island. x/y/z = resting position, phase = hover offset
  // (the train visits them in this order, so keep them left-to-right)
  const STATIONS = [
    // size controls how large each floating island appears.
    // The islands are intentionally different sizes for a more natural "memory world" layout.
    { id:'photos',    type:'photos',    tag:'Station 1', title:'Our Photos',      x:-5.3, y: 0.4, z: 0.4, color:0xeab3c2, phase:0.0, size:1.22 },
    { id:'bucket',    type:'bucket',   tag:'Station 2', title:'Our Bucket List', x:-1.8, y:-0.5, z:-1.4, color:0xa7c7e7, phase:1.6, size:1.05 },
    { id:'letters',   type:'letters',  tag:'Station 3', title:'Mailbox',         x: 1.8, y: 0.6, z: 1.2, color:0xf6e27a, phase:3.2, size:1.42 },
    { id:'countdown', type:'countdown',tag:'Station 4', title:'Countdown',       x: 5.3, y:-0.3, z:-1.0, color:0x9bbf8a, phase:4.8, size:1.16 },
  ];

  // ================= THREE.JS =================
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1,1,1,-1,-50,100);
const target = new THREE.Vector3(0, -0.3, 0);
let yaw = Math.atan2(4, 9);                       // left/right angle (unlimited)
let pitch = Math.atan2(4.8, Math.hypot(4, 9));    // up/down angle
const radius = Math.hypot(4, 4.8, 9);
function updateCamera(){
  camera.position.set(
    target.x + radius * Math.cos(pitch) * Math.sin(yaw),
    target.y + radius * Math.sin(pitch),
    target.z + radius * Math.cos(pitch) * Math.cos(yaw)
  );
  camera.lookAt(target);
}
updateCamera();
  let camZoom = 1;

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
  stageEl.insertBefore(renderer.domElement, stageEl.firstChild);

  function fitCamera(){
    const aspect = stageEl.clientWidth / stageEl.clientHeight;
    const half = Math.max(4.7, 7.2 / aspect); // full-screen framing with room for the larger islands
    camera.left = -half*aspect; camera.right = half*aspect;
    camera.top = half; camera.bottom = -half;
    camera.updateProjectionMatrix();
  }
  fitCamera();
  window.addEventListener('resize', () => {
    renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
    fitCamera();
  });

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const sun = new THREE.DirectionalLight(0xfff3e0, 0.5);
  sun.position.set(3,5,4);
  scene.add(sun);

  const worldGroup = new THREE.Group();
  scene.add(worldGroup);

  const M = c => new THREE.MeshLambertMaterial({ color:c });

  // frees geometry/materials/textures of everything in a group, then empties it
  function clearGroup(g){
    while(g.children.length){
      const c = g.children[0];
      g.remove(c);
      c.traverse(o => {
        if(o.geometry) o.geometry.dispose();
        if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
      });
    }
  }

  // ---- clouds (soft sprite puffs) ----
  const cloudGroup = new THREE.Group();
  const puffTex = (function(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,255,255,0.95)');
    gr.addColorStop(0.45,'rgba(255,255,255,0.5)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })();
  for(let i=0;i<14;i++){
    const c = new THREE.Group();
    const n = 5 + Math.floor(Math.random()*4), spread = 1.2 + Math.random()*1.4;
    for(let k=0;k<n;k++){
      const mat = new THREE.SpriteMaterial({ map:puffTex, transparent:true, depthWrite:false,
        opacity:0.4 + Math.random()*0.35, color: k%3===0 ? 0xf6e9f0 : 0xffffff });
      const sp = new THREE.Sprite(mat);
      const s = 1.2 + Math.random()*1.3;
      sp.scale.set(s*1.5, s, 1);
      sp.position.set((Math.random()-0.5)*spread*2, (Math.random()-0.3)*0.35, (Math.random()-0.5)*0.8);

    c.position.set(-14 + Math.random()*28, -3.9 + Math.random()*0.9, -5 + Math.random()*8);

    cloudGroup.add(c);
  }
  scene.add(cloudGroup);
  // ---- island pieces ----
  function makeIslandMesh(topColor){
    const mats = [ M(0xb98a5e), M(topColor), M(0x6f4e30) ]; // side, top, bottom
    return new THREE.Mesh(new THREE.CylinderGeometry(1.15, 0.6, 0.9, 9, 1, false), mats);
  }
  function makeTree(scale){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.5,0.1), M(0x8a5c3a)); trunk.position.y = 0.25;
    const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.4,14,10), M(0x6fae6f)); canopy.position.y = 0.65;
    g.add(trunk, canopy); g.scale.setScalar(scale||1);
    return g;
  }
  // a little prop per station so each island reads differently
  function makeProp(type){
    const g = new THREE.Group();
    const box = (w,h,d,c,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(c)); m.position.set(x,y,z); return m; };
    if(type === 'photos'){
      g.add(box(0.04,0.22,0.04,0x8a5c3a, 0,0.11,0), box(0.42,0.34,0.04,0xfffaf0, 0,0.4,0));
      const pic = new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.24), M(0xe79fb3)); pic.position.set(0,0.4,0.025); g.add(pic);
    } else if(type === 'bucket'){
      g.add(box(0.34,0.46,0.04,0xfaf3e3, 0,0.3,0), box(0.16,0.06,0.06,0x8a5c3a, 0,0.55,0));
      for(let i=0;i<3;i++){ const l = new THREE.Mesh(new THREE.PlaneGeometry(0.22,0.025), M(0xb9a77d)); l.position.set(0,0.4-i*0.09,0.025); g.add(l); }
    } else if(type === 'letters'){
      g.add(box(0.05,0.35,0.05,0x8a5c3a, 0,0.175,0), box(0.34,0.2,0.22,0xc94f4f, 0,0.42,0), box(0.04,0.14,0.02,0xf6e27a, 0.19,0.5,0));
    } else if(type === 'countdown'){
      g.add(box(0.05,0.25,0.05,0x8a5c3a, 0,0.125,0));
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.06,20), M(0xfffaf0));
      face.rotation.x = Math.PI/2; face.position.y = 0.42; g.add(face);
      g.add(box(0.02,0.14,0.02,0x4a3826, 0,0.46,0.04), box(0.1,0.02,0.02,0x4a3826, 0.04,0.42,0.04));
    }
    return g;
  }

  const ISLAND_TOP_Y = 0.15;
  const TRACK_Z = 1.0;            // the rail runs along the front of every island
  const stationMeshes = [];
  const islandGroups = [];
  const rocks = [];
  STATIONS.forEach((st, i) => {
    const ig = new THREE.Group();
    ig.position.set(st.x, st.y, st.z);

    const rock = makeIslandMesh(st.color);
    rock.position.y = ISLAND_TOP_Y - 0.45;
    ig.add(rock);
    rocks.push(rock);

    // signpost (a bit toward the back, so the rail passes in front)
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.6,0.06), M(0x8a5c3a)); pole.position.set(0, ISLAND_TOP_Y+0.3, -0.1);
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.32,0.05), M(0xfaf3e3)); board.position.set(0, ISLAND_TOP_Y+0.6, -0.1);
    ig.add(pole, board);

    const prop = makeProp(st.type);
    prop.position.set(0.62, ISLAND_TOP_Y, -0.15);
    ig.add(prop);

    const tree = makeTree(0.85 + i*0.04);
    tree.position.set(-0.6, ISLAND_TOP_Y, -0.2);
    ig.add(tree);

    // little station platform beside the rail (Jian + Tepan wait here)
    const plat = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.04,0.26), M(0xe8dcc0));
    plat.position.set(0, ISLAND_TOP_Y + 0.02, 0.4);
    ig.add(plat);

    // invisible tap target
    const hit = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshBasicMaterial({ visible:false }));
    hit.position.y = ISLAND_TOP_Y + 0.4;
    hit.userData.stationId = st.id;
    ig.add(hit);

    // soft shadow on the cloud layer
    const sh = new THREE.Mesh(
      new THREE.CircleGeometry(0.9 * (st.size || 1), 20),
      new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.1 })
    );
    sh.rotation.x = -Math.PI/2;
    sh.position.set(st.x, -3.3, st.z);
    worldGroup.add(sh);

    worldGroup.add(ig);
    stationMeshes.push(hit);
    islandGroups.push({ group:ig, baseY:st.y, phase:st.phase, id:st.id });
  });
  const gOf = id => islandGroups.find(g => g.id === id).group;
  // ---- floating island model replaces the placeholder rocks ----
  // Larger base size + per-station size multipliers.
  // Increase ISLAND_SCALE if you want the whole world even chunkier.
  const ISLAND_SCALE = 0.0155;
  new THREE.GLTFLoader().load('floating_island.glb', gltf => {
    const model = gltf.scene;
    model.position.set(0.025, 0, 0.15);                 // centres the island
    islandGroups.forEach(g => {
      const st = STATIONS.find(s => s.id === g.id);
      const pivot = new THREE.Group();
      const island = model.clone(true);
      island.scale.setScalar(ISLAND_SCALE * (st?.size || 1));
      pivot.add(island);
      pivot.rotation.y = Math.PI;                       // open grass faces the rail
      pivot.position.y = ISLAND_TOP_Y - 46 * ISLAND_SCALE * (st?.size || 1);
      g.group.add(pivot);
    });
    rocks.forEach(r => r.parent && r.parent.remove(r));
  }, undefined, err => console.warn('floating_island.glb failed to load', err));

  // ================= RAIL =================
  // a curve through the front of every island. rebuilt every frame from the islands' current
  // (bobbing) positions, so the rail floats along with them.
  const RAIL_Y = ISLAND_TOP_Y + 0.05;
  const trackPts = STATIONS.map(() => new THREE.Vector3());
  const curve = new THREE.CatmullRomCurve3(trackPts, false, 'centripetal');
  const N_SLEEP = 72, N_RAIL = 150;

  const sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(0.42,0.03,0.07), M(0x8a5c3a), N_SLEEP);
  const railL = new THREE.InstancedMesh(new THREE.BoxGeometry(0.03,0.03,0.11), M(0xb8bcc4), N_RAIL);
  const railR = new THREE.InstancedMesh(new THREE.BoxGeometry(0.03,0.03,0.11), M(0xb8bcc4), N_RAIL);
  [sleepers, railL, railR].forEach(m => { m.frustumCulled = false; worldGroup.add(m); });

  const dummy = new THREE.Object3D();
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpSide = new THREE.Vector3();

  function updateTrack(){
    islandGroups.forEach((g, i) => {
      const st = STATIONS[i];
      const railOffset = TRACK_Z * (st.size || 1);
      trackPts[i].set(
        g.group.position.x,
        g.group.position.y + RAIL_Y,
        g.group.position.z + railOffset
      );
    });
    for(let i = 0; i < N_SLEEP; i++){
      const u = i / (N_SLEEP - 1);
      curve.getPoint(u, tmpA); curve.getTangent(u, tmpB);
      dummy.position.set(tmpA.x, tmpA.y - 0.035, tmpA.z);
      dummy.lookAt(tmpA.x + tmpB.x, tmpA.y - 0.035 + tmpB.y, tmpA.z + tmpB.z);
      dummy.updateMatrix();
      sleepers.setMatrixAt(i, dummy.matrix);
    }
    for(let i = 0; i < N_RAIL; i++){
      const u = i / (N_RAIL - 1);
      curve.getPoint(u, tmpA); curve.getTangent(u, tmpB);
      dummy.position.copy(tmpA);
      dummy.lookAt(tmpA.x + tmpB.x, tmpA.y + tmpB.y, tmpA.z + tmpB.z);
      tmpSide.set(1,0,0).applyQuaternion(dummy.quaternion);
      dummy.position.copy(tmpA).addScaledVector(tmpSide, 0.12); dummy.position.y -= 0.015;
      dummy.updateMatrix(); railL.setMatrixAt(i, dummy.matrix);
      dummy.position.copy(tmpA).addScaledVector(tmpSide, -0.12); dummy.position.y -= 0.015;
      dummy.updateMatrix(); railR.setMatrixAt(i, dummy.matrix);
    }
    sleepers.instanceMatrix.needsUpdate = true;
    railL.instanceMatrix.needsUpdate = true;
    railR.instanceMatrix.needsUpdate = true;
  }

  // ================= TRAIN =================
  const TRACK_LEN_EST = 11;   // rough rail length, only used to spin the wheels at the right speed
  const VMAX = 0.26;          // top speed (fraction of the whole rail per second)
  const ACC  = 0.7;           // acceleration / braking

  const train = new THREE.Group();
  const wheels = [];
  (function buildTrain(){
    const box = (w,h,d,c,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(c)); m.position.set(x,y,z); train.add(m); return m; };
    // engine (front is +z)
    box(0.22,0.06,0.36, 0x4a3826, 0,0.11,0.3);
    const boiler = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.26,14), M(0xc94f4f));
    boiler.rotation.x = Math.PI/2; boiler.position.set(0,0.27,0.37); train.add(boiler);
    const chim = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.12,10), M(0x3a2c24));
    chim.position.set(0,0.41,0.44); train.add(chim);
    box(0.3,0.24,0.14, 0xc94f4f, 0,0.3,0.14);     // cabin
    box(0.35,0.03,0.2,  0xfaf3e3, 0,0.43,0.14);   // roof
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.03,8,6), new THREE.MeshBasicMaterial({ color:0xfff0a8 }));
    lamp.position.set(0,0.27,0.51); train.add(lamp);
    // tender
    box(0.26,0.1,0.2, 0x4a3826, 0,0.19,-0.06);
    box(0.2,0.05,0.16, 0x222222, 0,0.26,-0.06);
    // passenger car
    box(0.3,0.16,0.3,  0xeab3c2, 0,0.22,-0.36);
    box(0.34,0.03,0.34, 0xfaf3e3, 0,0.32,-0.36);
    [-0.32,-0.42].forEach(z => [1,-1].forEach(s => {
      const w = new THREE.Mesh(new THREE.PlaneGeometry(0.07,0.06), new THREE.MeshBasicMaterial({ color:0xfdf2d0 }));
      w.position.set(0.152*s, 0.24, z); w.rotation.y = s * Math.PI/2; train.add(w);
    }));
    // couplings
    box(0.04,0.03,0.08, 0x333333, 0,0.13,-0.19);
    box(0.04,0.03,0.08, 0x333333, 0,0.13,0.0);
    // wheels
    [0.38,0.22,-0.06,-0.3,-0.42].forEach(z => [1,-1].forEach(s => {
      const wg = new THREE.Group();
      wg.position.set(0.12*s, 0.07, z);
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,0.03,12), M(0x333333));
      disc.rotation.z = Math.PI/2; wg.add(disc);
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.034,0.1,0.015), M(0xd9d4c8));
      wg.add(spoke);
      train.add(wg); wheels.push(wg);
    }));
  })();
  worldGroup.add(train);

  const trainState = { t:0, target:0, vel:0, dir:1, pending:null, puffTimer:0, init:false };

  // chimney smoke
  const puffs = [];
  for(let i = 0; i < 10; i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6), new THREE.MeshBasicMaterial({ color:0xf7f4f0, transparent:true, opacity:0 }));
    m.visible = false; m.userData.live = false; m.userData.age = 0; m.userData.dx = 0;
    worldGroup.add(m); puffs.push(m);
  }
  function spawnPuff(){
    const m = puffs.find(p => !p.userData.live);
    if(!m) return;
    const v = new THREE.Vector3(0, 0.5, 0.44);
    train.localToWorld(v); worldGroup.worldToLocal(v);
    m.position.copy(v);
    m.userData.live = true; m.userData.age = 0; m.userData.dx = (Math.random()-0.5)*0.06;
    m.visible = true;
  }
  function updateSmoke(dt){
    if(Math.abs(trainState.vel) > 0.02){
      trainState.puffTimer -= dt;
      if(trainState.puffTimer <= 0){ spawnPuff(); trainState.puffTimer = 0.16; }
    }
    puffs.forEach(m => {
      if(!m.userData.live) return;
      m.userData.age += dt;
      const a = m.userData.age;
      m.position.y += 0.28*dt; m.position.x += m.userData.dx*dt;
      m.scale.setScalar(0.7 + a*1.8);
      m.material.opacity = Math.max(0, 0.75*(1 - a/1.0));
      if(a >= 1.0){ m.userData.live = false; m.visible = false; }
    });
  }

  function updateTrain(dt, now){
    const s = trainState;
    const dist = s.target - s.t;
    const adist = Math.abs(dist);

    // accelerate toward a speed that lets us brake exactly at the target
    let desired = 0;
    if(adist > 0.0015) desired = Math.sign(dist) * Math.min(VMAX, Math.sqrt(2 * ACC * adist));
    const dv = ACC * dt;
    s.vel += Math.max(-dv, Math.min(dv, desired - s.vel));
    s.t += s.vel * dt;

    const newDist = s.target - s.t;
    if(Math.abs(newDist) < 0.0015 || (adist > 0 && Math.sign(newDist) !== Math.sign(dist))){
      s.t = s.target; s.vel = 0;
    }
    s.t = Math.max(0, Math.min(1, s.t));
    if(Math.abs(s.vel) > 0.01) s.dir = Math.sign(s.vel);
    Sound.train(Math.abs(s.vel));

    // place + face along the rail (turns around on the spot when it changes direction)
    curve.getPoint(s.t, tmpA); curve.getTangent(s.t, tmpB);
    train.position.copy(tmpA);
    if(Math.abs(s.vel) > 0.02) train.position.y += Math.sin(now * 0.03) * 0.004;
    dummy.position.copy(tmpA);
    dummy.lookAt(tmpA.x + tmpB.x * s.dir, tmpA.y + tmpB.y * s.dir, tmpA.z + tmpB.z * s.dir);
    if(!s.init){ train.quaternion.copy(dummy.quaternion); s.init = true; }
    else train.quaternion.slerp(dummy.quaternion, 1 - Math.exp(-dt * 9));

    // wheels
    const spin = Math.abs(s.vel) * dt * TRACK_LEN_EST / 0.065;
    wheels.forEach(w => { w.rotation.x += spin; });

    // arrived at the station the user clicked → open it
    if(s.pending !== null && s.vel === 0 && s.t === s.target){
      const idx = s.pending; s.pending = null;
      openStation(STATIONS[idx].id);
    }
  }

  // send the train to a station. open=true → open that island's popup once it arrives
  function goToStation(id, open){
    const idx = STATIONS.findIndex(s => s.id === id);
    if(idx < 0) return;
    const newTarget = idx / (STATIONS.length - 1);
    if(!open && newTarget === trainState.target) return;  // hovering the same island again: don't cancel a pending open
    if(Math.abs(trainState.t - newTarget) > 0.02) Sound.sfx('whistle');
    trainState.target = newTarget;
    trainState.pending = open ? idx : null;
    if(open && Math.abs(trainState.t - newTarget) < 0.002){ trainState.pending = null; openStation(id); }
  }

  // ================= LIVING ISLAND =================
  // what you two add shows up on the islands: photos hang on a string, lanterns for bucket-list
  // items (lit when done), butterflies for letters.

  // ---- photos island: a string between two poles, newest 5 photos hang from it ----
  const photoIsland = gOf('photos');
  const photoLine = new THREE.Group();
  photoIsland.add(photoLine);
  const frameGroup = new THREE.Group();
  photoLine.add(frameGroup);
  const stringCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.85, ISLAND_TOP_Y + 1.2, -0.62),
    new THREE.Vector3(0,     ISLAND_TOP_Y + 1.02, -0.62),
    new THREE.Vector3(0.85,  ISLAND_TOP_Y + 1.2, -0.62)

  function fileToDataUrl(file, max=560, q=0.68){
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = rej;
      fr.onload = () => {
        const img = new Image();
        img.onerror = rej;
        img.onload = () => {
          const s = Math.min(1, max/Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', q));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  // full-size viewer with prev/next (buttons, arrow keys, Esc to close)
  function openViewer(list, start){
    let i = start;
    const v = document.createElement('div');

    document.body.appendChild(v);
    function step(d){ i = (i + d + list.length) % list.length; draw(); }
    function draw(){
      const p = list[i];
      v.innerHTML = `
        <button class="vx">✕</button>
        ${list.length > 1 ? '<button class="vnav vprev">‹</button><button class="vnav vnext">›</button>' : ''}
        <figure>
          <img src="${escapeHtml(p.src)}">
          <figcaption>${escapeHtml(p.caption||'')}<small>${escapeHtml(p.by||'')} · ${escapeHtml(p.date||'')}</small></figcaption>
        </figure>`;
      v.querySelector('.vx').onclick = close;
      const pr = v.querySelector('.vprev'), nx = v.querySelector('.vnext');
      if(pr){ pr.onclick = e => { e.stopPropagation(); step(-1); }; nx.onclick = e => { e.stopPropagation(); step(1); }; }
    }
    function onKey(e){
      if(e.key === 'Escape') close();
      else if(e.key === 'ArrowLeft' && list.length > 1) step(-1);
      else if(e.key === 'ArrowRight' && list.length > 1) step(1);
    }
    function close(){ document.removeEventListener('keydown', onKey); v.remove(); }
    v.addEventListener('click', e => { if(e.target === v) close(); });
    document.addEventListener('keydown', onKey);
    draw();
  }

    modal.querySelector('#add').addEventListener('click', async () => {
      const files = Array.from(modal.querySelector('#file').files);
      const link = modal.querySelector('#url').value.trim();
      const caption = modal.querySelector('#cap').value.trim();
      if(!files.length && !link){ status.textContent = 'pick photos or paste a link'; return; }
      status.textContent = 'adding…';
      const added = [];
      try{
        for(const f of files) added.push({ src: await fileToDataUrl(f), caption, by:me, date:fmt(isoToday()) });
      }catch(e){ status.textContent = "couldn't read one of the images"; return; }
      if(link) added.push({ src:link, caption, by:me, date:fmt(isoToday()) });
      photos.unshift(...added);
      const ok = await saveShared(KEY, photos);
      if(!ok){ photos.splice(0, added.length); status.textContent = "couldn't save — try again"; return; }
      render();
      applyPhotos(photos);
      modal.querySelector('#file').value = ''; modal.querySelector('#url').value = ''; modal.querySelector('#cap').value = '';
      status.textContent = '';
      showTab('gallery');
    });
  }

  // ================= STATION 2: BUCKET LIST =================
  async function openBucket(st){
    shell(st, `
      <div class="progress" id="prog"></div>
      <div id="list"><div class="empty-mini">loading…</div></div>
      <div class="p-form">
        ${whoPicker()}
        <div class="add-row"><input type="text" id="txt" placeholder="visit taiwan together"><button class="m-btn" id="add">add</button></div>
      </div>`);
    bindWho();
    const KEY = 'bucket';
    let items = await loadShared(KEY, []);
    applyLanterns(items);
    const listEl = modal.querySelector('#list');

    function render(){
      const done = items.filter(x => x.done).length;
      modal.querySelector('#prog').textContent = items.length ? `${done} / ${items.length} done` : '';
      if(!items.length){ listEl.innerHTML = '<div class="empty-mini">nothing yet — what do you want to do together?</div>'; return; }
      const order = items.map((b,i) => ({b,i})).sort((a,c) => (a.b.done?1:0) - (c.b.done?1:0));
      listEl.innerHTML = order.map(({b,i}) => `
        <div class="bucket-item ${b.done?'done':''}">
          <div class="checkbox ${b.done?'checked':''}" data-i="${i}"></div>
          <div class="t">${escapeHtml(b.text)}<small>${escapeHtml(b.by||'')}</small></div>
          <button class="rm" data-i="${i}">✕</button>
        </div>`).join('');
      listEl.querySelectorAll('.checkbox').forEach(cb => cb.addEventListener('click', async () => {
        const i = Number(cb.dataset.i); items[i].done = !items[i].done; render(); applyLanterns(items); await saveShared(KEY, items);
      }));
      listEl.querySelectorAll('.rm').forEach(b => armDelete(b, async () => {
        items.splice(Number(b.dataset.i), 1); render(); applyLanterns(items); await saveShared(KEY, items);
      }));
    }
    render();

    async function add(){
      const inp = modal.querySelector('#txt');
      const text = inp.value.trim();
      if(!text) return;
      items.push({ text, done:false, by:me });
      inp.value = '';
      render();
      applyLanterns(items);
      await saveShared(KEY, items);
    }
    modal.querySelector('#add').addEventListener('click', add);
    modal.querySelector('#txt').addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
  }

  // ================= STATION 3: MAILBOX =================
  async function openLetters(st){
    shell(st, `
      <div id="inbox"><div class="empty-mini">loading…</div></div>
      <div class="p-form">
        ${whoPicker()}
        <label>write a letter</label>
        <textarea id="body" placeholder="dear …"></textarea>
        <label>seal until (optional — it stays hidden until that day)</label>
        <input type="date" id="seal">
        <div style="margin-top:10px"><button class="m-btn" id="send">drop in mailbox</button><span class="saved-note" id="status"></span></div>
      </div>`);
    bindWho();
    const KEY = 'letters';
    let letters = await loadShared(KEY, []);
    applyButterflies(letters);
    const inbox = modal.querySelector('#inbox');
    const status = modal.querySelector('#status');

    function render(){
      if(!letters.length){ inbox.innerHTML = '<div class="empty-mini">mailbox is empty — leave the first letter</div>'; return; }
      const today = isoToday();
      inbox.innerHTML = letters.map(l => {
        const sealed = l.seal && l.seal > today;
        return `<div class="letter ${sealed?'sealed':''}">
          <div class="meta">from ${escapeHtml(l.by)} · ${escapeHtml(fmt(l.at))}${sealed ? ' · 💌 sealed until ' + escapeHtml(fmt(l.seal)) : ''}</div>
          <div class="body">${sealed ? 'this one opens on ' + escapeHtml(fmt(l.seal)) + '…' : escapeHtml(l.text)}</div>
        </div>`;
      }).join('');
    }
    render();

    modal.querySelector('#send').addEventListener('click', async () => {
      const text = modal.querySelector('#body').value.trim();
      const seal = modal.querySelector('#seal').value;
      if(!text){ status.textContent = 'write something first'; return; }
      letters.unshift({ by:me, text, at:isoToday(), seal:seal || '' });
      const ok = await saveShared(KEY, letters);
      if(!ok){ letters.shift(); status.textContent = "couldn't save — try again"; return; }
      render();
      applyButterflies(letters);
      modal.querySelector('#body').value = ''; modal.querySelector('#seal').value = '';
      status.textContent = 'sent ✓';
    });
  }

  // ================= STATION 4: COUNTDOWN =================
  async function openCountdown(st){
    shell(st, `<div id="cd"><div class="empty-mini">loading…</div></div>`);
    const KEY = 'countdown';
    let d = await loadShared(KEY, { meetLabel:'', meetDate:'', sinceDate:'' });
    const cd = modal.querySelector('#cd');

    function render(){
      const today = isoToday();
      let meet = '<div class="big"><div class="lbl">no meet-up date set yet</div></div>';
      if(d.meetDate){
        const n = daysBetween(today, d.meetDate);
        const label = escapeHtml(d.meetLabel || 'we meet');
        if(n > 0) meet = `<div class="big"><div class="num">${n}</div><div class="lbl">day${n===1?'':'s'} until ${label}</div></div>`;
        else if(n === 0) meet = `<div class="big"><div class="num">today!</div><div class="lbl">${label}</div></div>`;
        else meet = `<div class="big"><div class="lbl">${label} was ${-n} day${n===-1?'':'s'} ago — set the next one 💛</div></div>`;
      }
      let together = '';
      if(d.sinceDate){
        const n = daysBetween(d.sinceDate, today);
        if(n >= 0) together = `<div class="big"><div class="num">${n}</div><div class="lbl">days together</div></div>`;
      }
      cd.innerHTML = `${meet}${together}
        <div class="p-form">
          <label>next meet-up — what is it?</label>
          <input type="text" id="lab" value="${escapeHtml(d.meetLabel)}" placeholder="seeing each other in taiwan">
          <label>next meet-up — date</label>
          <input type="date" id="md" value="${escapeHtml(d.meetDate)}">
          <label>together since</label>
          <input type="date" id="sd" value="${escapeHtml(d.sinceDate)}">
          <div style="margin-top:10px"><button class="m-btn" id="save">save</button><span class="saved-note" id="status"></span></div>
        </div>`;
      cd.querySelector('#save').addEventListener('click', async () => {
        d = {
          meetLabel: cd.querySelector('#lab').value.trim(),
          meetDate:  cd.querySelector('#md').value,
          sinceDate: cd.querySelector('#sd').value
        };
        const ok = await saveShared(KEY, d);
        render();
        cd.querySelector('#status').textContent = ok ? 'saved ✓' : "couldn't save — try again";
      });
    }
    render();
  }

  // ================= START =================
  async function startPresence(){
    await loadPresence();
    const mine = presence[me];
    await writePresence(mine && mine.s ? mine.s : STATIONS[0].id);
  }
  function init(){
    refreshPill();
    refreshLiving();
    if(needIdentity){
      whoOverlay.classList.add('show');
      whoOverlay.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        setMe(b.dataset.n);
        whoOverlay.classList.remove('show');
        refreshPill();
        startPresence();
      }));
    } else {
      startPresence();
    }
    // pick up whatever the other person added / where they went
    setInterval(() => { refreshLiving(); loadPresence(); }, 20000);
    // keep the "2h ago" text fresh
    setInterval(renderPresenceLabels, 30000);
  }
  init();
})();
</script>
